[pytest]
# Chạy từ thư mục gốc dự án: python -m pytest
# Thêm thư mục gốc vào đường dẫn tìm gói để `import src...` chạy được mà không
# cần cài dự án như một gói.
pythonpath = .
testpaths = tests
addopts = -q --strict-markers

markers =
    slow: cần nạp mô hình và dữ liệu thật, chạy vài giây
    neo4j: cần một máy chủ Neo4j đang chạy; tự bỏ qua khi .env chưa cấu hình

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
