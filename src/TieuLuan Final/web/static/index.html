<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đồng Tâm AI Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27none%27 stroke=%27%23e8a33d%27 stroke-width=%272%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%23d9607a%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/vendor/echarts.min.js" defer></script>
<script src="/static/vendor/3d-force-graph.min.js" defer></script>
<script type="module" src="/static/js/app.js"></script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header class="top">
  <a class="brand" href="/" data-nav><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><circle cx="16" cy="16" r="14" /><circle cx="16" cy="16" r="9" /><circle cx="16" cy="16" r="4" /></svg><span>Đồng Tâm <em>AI Lab</em></span></a>
  <nav id="nav" aria-label="Trang chính"></nav>
  <div class="tools">
    <button id="palette-open" title="Bảng lệnh (Ctrl+K)">Tìm <kbd>Ctrl K</kbd></button>
    <button id="theme" title="Đổi nền sáng hoặc tối" aria-label="Đổi nền">◐</button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<footer class="foot"><span id="foot-status">Đang đọc trạng thái máy...</span><span>Chạy cục bộ ở 127.0.0.1, không gửi dữ liệu ra ngoài.</span></footer>
<dialog id="palette"><input id="palette-q" placeholder="Gõ tên trang, dataset hoặc mô hình..." autocomplete="off"><ul id="palette-list"></ul></dialog>
</body>
</html>
